<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CHINMAY // SECRET LENS</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg-main:#050505;
      --bg-card:#111111;
      --text-main:#ffffff;
      --text-sub:#888888;
      --accent:#d71921; /* Nothing Red Accent */
      --border:#262626;
    }
    *{ margin:0; padding:0; box-sizing:border-box; font-family:'Space Mono', monospace; }
    body{ background:var(--bg-main); color:var(--text-main); min-height:100vh; display:flex; flex-direction:column; padding:20px; }
    
    header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; border-bottom:2px dashed var(--border); padding-bottom:16px; }
    .logo-area h1{ font-size:1.1rem; font-weight:700; letter-spacing:2px; color:var(--text-main); text-transform:uppercase; }
    .logo-area h1 span{ color:var(--accent); }
    
    .badge{ font-size:0.65rem; font-weight:700; padding:4px 10px; border:1px solid var(--text-sub); color:var(--text-sub); text-transform:uppercase; letter-spacing:1px; }
    .badge.admin{ border-color:var(--accent); color:var(--accent); background:rgba(215,25,33,0.05); }

    .control-box{ background:var(--bg-card); padding:20px; border:1px solid var(--border); margin-bottom:24px; position:relative; }
    .control-box::before{ content:'// CONTROL PANEL'; display:block; font-size:0.65rem; color:var(--accent); margin-bottom:12px; letter-spacing:2px; font-weight:700; }
    
    .control-box input[type="text"]{ width:100%; padding:12px 14px; border-radius:0; border:1px solid var(--border); background:#000; color:#fff; font-size:0.85rem; margin-bottom:14px; outline:none; }
    .control-box input[type="text"]:focus{ border-color:var(--accent); }
    
    .camera-container { display: none; margin-bottom: 14px; text-align: center; background: #000; border: 1px solid var(--border); }
    video { width: 100%; max-height: 350px; object-fit: cover; display: block; filter: grayscale(15%) contrast(110%); }
    
    .btn-group{ display:flex; gap:10px; }
    .btn{ flex:1; padding:12px; border:none; border-radius:0; font-weight:700; font-size:0.75rem; cursor:pointer; text-transform:uppercase; letter-spacing:1px; transition:all 0.2s; border:1px solid var(--border); }
    .btn-capture{ background:var(--text-main); color:#000; }
    .btn-capture:hover{ background:var(--accent); color:#fff; border-color:var(--accent); }
    .btn-click-shot{ background:var(--accent); color:#fff; border-color:var(--accent); }
    .btn-close{ background:transparent; color:var(--text-sub); }
    .btn:active{ opacity:0.8; }

    .section-title{ font-size:0.75rem; color:var(--text-sub); letter-spacing:2px; text-transform:uppercase; margin-bottom:16px; display:flex; align-items:center; gap:10px; }
    .section-title::after{ content:''; flex:1; height:1px; background:var(--border); }

    .gallery-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:20px; }
    .photo-card{ background:var(--bg-card); border:1px solid var(--border); display:flex; flex-direction:column; position:relative; transition:border-color 0.2s; }
    .photo-card:hover{ border-color:var(--text-sub); }
    .photo-img{ width:100%; height:240px; object-fit:cover; display:block; cursor:pointer; filter:grayscale(10%); }
    .photo-info{ padding:14px; display:flex; flex-direction:column; gap:10px; flex:1; justify-content:space-between; }
    .photo-tagline{ font-size:0.85rem; font-weight:400; color:var(--text-main); letter-spacing:0.5px; }
    .photo-footer{ display:flex; justify-content:space-between; align-items:center; font-size:0.7rem; color:var(--text-sub); border-top:1px dashed var(--border); padding-top:10px; }
    
    .btn-action-sm{ background:transparent; border:1px solid var(--border); color:var(--text-main); padding:6px 10px; font-size:0.65rem; font-weight:700; cursor:pointer; text-transform:uppercase; letter-spacing:1px; text-decoration:none; }
    .btn-action-sm:hover{ border-color:var(--text-main); }
    .btn-del{ border-color:var(--accent); color:var(--accent); }
    .btn-del:hover{ background:var(--accent); color:#fff; }

    .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(50px); background:#111; border:1px solid var(--accent); color:#fff; padding:12px 24px; font-weight:700; font-size:0.75rem; letter-spacing:1px; opacity:0; transition:all 0.3s ease; pointer-events:none; z-index:1000; text-transform:uppercase; }
    .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

    @media(max-width:480px){
      .gallery-grid{ grid-template-columns:1fr; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-area">
      <h1>CHINMAY <span>//</span> LENS</h1>
    </div>
    <div id="mode-badge" class="badge">USER_VIEW</div>
  </header>

  <div id="admin-panel" class="control-box" style="display:none;">
    <input type="text" id="photo-tagline-input" placeholder="ENTER_TAGLINE..." autocomplete="off">
    
    <div id="camera-box" class="camera-container">
      <video id="video" autoplay playsinline></video>
      <div style="padding: 12px; display: flex; gap: 10px; background: #000; border-top: 1px solid var(--border);">
        <button class="btn btn-click-shot" onclick="takeSnapshot()">[ SNAP & STORE ]</button>
        <button class="btn btn-close" onclick="stopCamera()">[ CLOSE ]</button>
      </div>
    </div>

    <div class="btn-group" id="start-cam-btn-wrap">
      <button class="btn btn-capture" onclick="startCamera()">[ OPEN CAMERA STREAM ]</button>
    </div>
  </div>

  <div class="section-title">ARCHIVED_CAPTURES</div>
  <canvas id="canvas" style="display:none;"></canvas>
  <div class="gallery-grid" id="gallery-container"></div>
  <div id="toast" class="toast"></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const isAdmin = urlParams.get('admin') === 'true';

    if (isAdmin) {
      document.getElementById('admin-panel').style.display = 'block';
      const badge = document.getElementById('mode-badge');
      badge.innerText = 'ADMIN_MODE';
      badge.classList.add('admin');
    }

    let db;
    let videoStream = null;

    const request = indexedDB.open('ChinmayNothingLensDB', 1);

    request.onerror = function(event) {
      console.error('DB Error: ' + event.target.errorCode);
    };

    request.onsuccess = function(event) {
      db = event.target.result;
      renderGallery();
    };

    request.onupgradeneeded = function(event) {
      const dbInstance = event.target.result;
      if (!dbInstance.objectStoreNames.contains('photos')) {
        dbInstance.createObjectStore('photos', { keyPath: 'id', autoIncrement: true });
      }
    };

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    async function startCamera() {
      const tagline = document.getElementById('photo-tagline-input').value.trim();
      if (!tagline) {
        showToast('ERROR: TAGLINE_REQUIRED');
        document.getElementById('photo-tagline-input').focus();
        return;
      }

      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'environment' }, 
          audio: false 
        });
        const video = document.getElementById('video');
        video.srcObject = videoStream;
        document.getElementById('camera-box').style.display = 'block';
        document.getElementById('start-cam-btn-wrap').style.display = 'none';
      } catch (err) {
        alert('CAMERA_ACCESS_FAILED: ' + err.message);
      }
    }

    function stopCamera() {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
      }
      document.getElementById('camera-box').style.display = 'none';
      document.getElementById('start-cam-btn-wrap').style.display = 'flex';
    }

    function takeSnapshot() {
      const tagline = document.getElementById('photo-tagline-input').value.trim();
      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.85);

      const photoData = {
        url: compressedDataUrl,
        tagline: tagline,
        date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
      };

      const transaction = db.transaction(['photos'], 'readwrite');
      const store = transaction.objectStore('photos');
      const req = store.add(photoData);

      req.onsuccess = function() {
        document.getElementById('photo-tagline-input').value = '';
        stopCamera();
        renderGallery();
        showToast('SUCCESS: STORED_SECURELY');
      };

      req.onerror = function() {
        showToast('ERROR: DB_WRITE_FAILED');
      };
    }

    function deletePhoto(id) {
      if (!isAdmin) return;
      if (confirm('CONFIRM_DELETE_OPERATION?')) {
        const transaction = db.transaction(['photos'], 'readwrite');
        const store = transaction.objectStore('photos');
        const req = store.delete(Number(id));

        req.onsuccess = function() {
          renderGallery();
          showToast('STATUS: PHOTO_DELETED');
        };
      }
    }

    function renderGallery() {
      if (!db) return;
      const container = document.getElementById('gallery-container');
      container.innerHTML = '';

      const transaction = db.transaction(['photos'], 'readonly');
      const store = transaction.objectStore('photos');
      const requestAll = store.getAll();

      requestAll.onsuccess = function(event) {
        const photosDB = event.target.result.reverse();

        if (photosDB.length === 0) {
          container.innerHTML = `<div style="grid-format: 1/-1; grid-column:1/-1; text-align:center; color:var(--text-sub); padding:40px; font-size:0.75rem; letter-spacing:1px;">// NO_ARCHIVED_CAPTURES_FOUND</div>`;
          return;
        }

        photosDB.forEach((item) => {
          const card = document.createElement('div');
          card.className = 'photo-card';
          card.innerHTML = `
            <img src="${item.url}" class="photo-img" onclick="window.open('${item.url}', '_blank')">
            <div class="photo-info">
              <div class="photo-tagline">"${escapeHtml(item.tagline)}"</div>
              <div class="photo-footer">
                <span>${item.date}</span>
                <div style="display:flex; gap:6px;">
                  <a href="${item.url}" download="Chinmay_Nothing_${item.id}.jpg" class="btn-action-sm">DOWNLOAD</a>
                  ${isAdmin ? `<button class="btn-action-sm btn-del" onclick="deletePhoto(${item.id})">DELETE</button>` : ''}
                </div>
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      };
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, match => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[match]));
    }
  </script>
</body>
</html>
