<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PHOTOGRAPHY WORK</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #ffffff;
      --bg-card: #f8f8f8;
      --text-main: #000000;
      --text-sub: #555555;
      --border: #000000;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'VT323', monospace; letter-spacing: 2px; }
    body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; padding: 24px; text-transform: uppercase; }
    
    header { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 35px; border-bottom: 4px solid var(--border); padding-bottom: 20px; gap: 12px; }
    .logo-area h1 { font-size: 3.5rem; font-weight: 400; color: var(--text-main); line-height: 1; text-shadow: 2px 2px 0px rgba(0,0,0,0.1); }
    
    .badge { font-size: 1.2rem; padding: 6px 20px; border: 2px solid var(--border); background: var(--text-main); color: var(--bg-main); border-radius: 50px; }
    .badge.admin { background: var(--bg-main); color: var(--text-main); }

    .control-box { background: var(--bg-card); padding: 28px; border: 3px solid var(--border); border-radius: 24px; margin-bottom: 35px; box-shadow: 6px 6px 0px #000000; text-align: center; max-width: 600px; margin-left: auto; margin-right: auto; width: 100%; }
    .control-box h3 { font-size: 1.8rem; margin-bottom: 16px; font-weight: 400; }
    
    .control-box input[type="text"] { width: 100%; padding: 14px 20px; border-radius: 50px; border: 2px solid var(--border); background: #ffffff; color: #000; font-size: 1.4rem; margin-bottom: 18px; outline: none; text-align: center; }
    .control-box input[type="text"]:focus { background: #000; color: #fff; }
    
    .camera-container { display: none; margin-bottom: 18px; text-align: center; background: #000; border: 3px solid var(--border); border-radius: 20px; overflow: hidden; }
    video { width: 100%; max-height: 400px; object-fit: cover; display: block; }
    
    .btn-group { display: flex; gap: 12px; justify-content: center; }
    .btn { flex: 1; padding: 14px; border: 2px solid var(--border); border-radius: 50px; font-weight: 400; font-size: 1.3rem; cursor: pointer; text-transform: uppercase; transition: all 0.2s; }
    .btn-capture { background: var(--text-main); color: var(--bg-main); }
    .btn-capture:hover { background: var(--bg-main); color: var(--text-main); }
    .btn-click-shot { background: var(--text-main); color: var(--bg-main); }
    .btn-close { background: transparent; color: var(--text-main); }
    .btn:active { transform: scale(0.98); }

    .section-title { font-size: 2.5rem; text-align: center; margin-bottom: 25px; display: flex; align-items: center; justify-content: center; gap: 15px; }
    .section-title::before, .section-title::after { content: ''; flex: 1; height: 3px; background: var(--border); }

    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
    .photo-card { background: var(--bg-card); border: 3px solid var(--border); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 5px 5px 0px #000000; transition: transform 0.2s; }
    .photo-card:hover { transform: translateY(-4px); }
    .photo-img { width: 100%; height: 260px; object-fit: cover; display: block; cursor: pointer; border-bottom: 3px solid var(--border); }
    .photo-info { padding: 20px; display: flex; flex-direction: column; gap: 12px; flex: 1; justify-content: space-between; }
    .photo-tagline { font-size: 1.5rem; font-weight: 400; color: var(--text-main); text-align: center; }
    .photo-footer { display: flex; justify-content: space-between; align-items: center; font-size: 1.1rem; color: var(--text-sub); border-top: 2px dashed #cccccc; padding-top: 12px; }
    
    .btn-action-sm { background: var(--bg-main); border: 2px solid var(--border); color: var(--text-main); padding: 8px 16px; font-size: 1.1rem; cursor: pointer; text-transform: uppercase; border-radius: 50px; text-decoration: none; transition: all 0.2s; }
    .btn-action-sm:hover { background: var(--text-main); color: var(--bg-main); }
    .btn-del { background: var(--text-main); color: var(--bg-main); }
    .btn-del:hover { background: #000; color: #fff; }

    footer.site-footer { margin-top: 60px; text-align: center; border-top: 4px solid var(--border); padding-top: 30px; font-size: 1.2rem; color: var(--text-sub); display: flex; flex-direction: column; gap: 8px; }
    footer.site-footer span { color: var(--text-main); font-weight: bold; }

    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(50px); background: #000; color: #fff; border: 3px solid #000; padding: 14px 28px; font-size: 1.3rem; opacity: 0; transition: all 0.3s ease; pointer-events: none; z-index: 1000; border-radius: 50px; box-shadow: 4px 4px 0px rgba(0,0,0,0.5); }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media(max-width: 480px) {
      .gallery-grid { grid-template-columns: 1fr; }
      body { padding: 16px; }
      .logo-area h1 { font-size: 2.5rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-area">
      <h1>PHOTOGRAPHY WORK</h1>
    </div>
    <div id="mode-badge" class="badge">USER_VIEW</div>
  </header>

  <div id="admin-panel" class="control-box" style="display:none;">
    <h3>// NEW CAPTURE CONTROL</h3>
    <input type="text" id="photo-tagline-input" placeholder="ENTER AMAZING TAGLINE..." autocomplete="off">
    
    <div id="camera-box" class="camera-container">
      <video id="video" autoplay playsinline></video>
      <div style="padding: 14px; display: flex; gap: 12px; background: #000; border-top: 3px solid var(--border);">
        <button class="btn btn-click-shot" onclick="takeSnapshot()">SNAP & STORE</button>
        <button class="btn btn-close" onclick="stopCamera()">CLOSE</button>
      </div>
    </div>

    <div class="btn-group" id="start-cam-btn-wrap">
      <button class="btn btn-capture" onclick="startCamera()">OPEN CAMERA</button>
    </div>
  </div>

  <div class="section-title">ARCHIVED GALLERY</div>
  <canvas id="canvas" style="display:none;"></canvas>
  <div class="gallery-grid" id="gallery-container"></div>

  <footer class="site-footer">
    <div>&copy; 2026 PHOTOGRAPHY WORK. ALL RIGHTS RESERVED.</div>
    <div>CREATED WITH PASSION BY <span>CHINMAY</span></div>
  </footer>

  <div id="toast" class="toast"></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const isAdmin = urlParams.get('admin') === 'true';

    if (isAdmin) {
      document.getElementById('admin-panel').style.display = 'block';
      const badge = document.getElementById('mode-badge');
      badge.innerText = 'ADMIN_MODE';
      badge.classList.add('admin');
    }

    let db;
    let videoStream = null;

    const request = indexedDB.open('ChinmayNDotLensDB', 2);

    request.onerror = function(event) {
      console.error('DB Error: ' + event.target.errorCode);
    };

    request.onsuccess = function(event) {
      db = event.target.result;
      renderGallery();
    };

    request.onupgradeneeded = function(event) {
      const dbInstance = event.target.result;
      if (!dbInstance.objectStoreNames.contains('photos')) {
        dbInstance.createObjectStore('photos', { keyPath: 'id', autoIncrement: true });
      }
    };

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    async function startCamera() {
      const tagline = document.getElementById('photo-tagline-input').value.trim();
      if (!tagline) {
        showToast('PEHLE TAGLINE DAAL MERE BHAI!');
        document.getElementById('photo-tagline-input').focus();
        return;
      }

      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'environment' }, 
          audio: false 
        });
        const video = document.getElementById('video');
        video.srcObject = videoStream;
        document.getElementById('camera-box').style.display = 'block';
        document.getElementById('start-cam-btn-wrap').style.display = 'none';
      } catch (err) {
        alert('CAMERA ACCESS ERROR: ' + err.message);
      }
    }

    function stopCamera() {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
      }
      document.getElementById('camera-box').style.display = 'none';
      document.getElementById('start-cam-btn-wrap').style.display = 'flex';
    }

    function takeSnapshot() {
      const tagline = document.getElementById('photo-tagline-input').value.trim();
      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.85);

      const photoData = {
        url: compressedDataUrl,
        tagline: tagline,
        date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
      };

      const transaction = db.transaction(['photos'], 'readwrite');
      const store = transaction.objectStore('photos');
      const req = store.add(photoData);

      req.onsuccess = function() {
        document.getElementById('photo-tagline-input').value = '';
        stopCamera();
        renderGallery();
        showToast('PHOTO CAPTURED & SAVED SECURELY!');
      };

      req.onerror = function() {
        showToast('ERROR SAVING PHOTO.');
      };
    }

    function deletePhoto(id) {
      if (!isAdmin) return;
      if (confirm('KYA AAP IS PHOTO KO DELETE KARNA CHAHTE HAIN?')) {
        const transaction = db.transaction(['photos'], 'readwrite');
        const store = transaction.objectStore('photos');
        const req = store.delete(Number(id));

        req.onsuccess = function() {
          renderGallery();
          showToast('PHOTO DELETED SUCCESSFULLY.');
        };
      }
    }

    function renderGallery() {
      if (!db) return;
      const container = document.getElementById('gallery-container');
      container.innerHTML = '';

      const transaction = db.transaction(['photos'], 'readonly');
      const store = transaction.objectStore('photos');
      const requestAll = store.getAll();

      requestAll.onsuccess = function(event) {
        const photosDB = event.target.result.reverse();

        if (photosDB.length === 0) {
          container.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:var(--text-sub); padding:40px; font-size:1.4rem;">// ABHI TAK KOI PHOTO NAHI HAI. ADMIN LINK SE ADD KAREIN!</div>`;
          return;
        }

        photosDB.forEach((item) => {
          const card = document.createElement('div');
          card.className = 'photo-card';
          card.innerHTML = `
            <img src="${item.url}" class="photo-img" onclick="window.open('${item.url}', '_blank')">
            <div class="photo-info">
              <div class="photo-tagline">"${escapeHtml(item.tagline)}"</div>
              <div class="photo-footer">
                <span>${item.date}</span>
                <div style="display:flex; gap:8px;">
                  <a href="${item.url}" download="Chinmay_Lens_${item.id}.jpg" class="btn-action-sm">SAVE</a>
                  ${isAdmin ? `<button class="btn-action-sm btn-del" onclick="deletePhoto(${item.id})">DELETE</button>` : ''}
                </div>
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      };
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, match => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[match]));
    }
  </script>
</body>
</html>
