<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PHOTOGRAPHY WORK // CHINMAY</title>
  <link href="https://db.onlinewebfonts.com/c/5f21b8d13dad527377311ec2d5388bdf?family=Ndot+55" rel="stylesheet">
  <style>
    :root {
      --bg-main: #050505;
      --bg-card: #0f0f0f;
      --text-main: #ffffff;
      --text-sub: #777777;
      --border: #222222;
      --glow: rgba(255, 255, 255, 0.15);
    }
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      font-family: "Ndot 55", monospace; 
      letter-spacing: 2px; 
    }
    body { 
      background: var(--bg-main); 
      color: var(--text-main); 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
      padding: 30px 20px; 
      text-transform: uppercase; 
      overflow-x: hidden;
      position: relative;
    }

    /* Background Moving Ambient Glow Effect */
    .bg-glow {
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200vw;
      height: 200vh;
      background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 60%);
      animation: rotateGlow 20s linear infinite;
      pointer-events: none;
      z-index: 0;
    }
    @keyframes rotateGlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    header, .control-box, .section-title, .gallery-grid, footer {
      position: relative;
      z-index: 1;
    }
    
    header { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      text-align: center; 
      margin-bottom: 45px; 
      border-bottom: 1px solid var(--border); 
      padding-bottom: 25px; 
      gap: 15px; 
    }
    
    .logo-area h1 { 
      font-size: 4rem; 
      font-weight: 400; 
      color: var(--text-main); 
      line-height: 1.1; 
      text-align: center; 
      width: 100%; 
      animation: pulseGlow 3s ease-in-out infinite alternate;
    }
    @keyframes pulseGlow {
      0% { text-shadow: 0 0 10px rgba(255,255,255,0.1); }
      100% { text-shadow: 0 0 30px rgba(255,255,255,0.4), 0 0 60px rgba(255,255,255,0.2); }
    }
    
    .badge { 
      font-size: 1rem; 
      padding: 6px 18px; 
      border: 1px solid var(--border); 
      background: rgba(255,255,255,0.03); 
      color: var(--text-sub); 
      border-radius: 100px; 
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }
    .badge:hover { border-color: #fff; color: #fff; transform: translateY(-2px); }
    .badge.admin { 
      background: var(--text-main); 
      color: var(--bg-main); 
      border-color: var(--text-main); 
      box-shadow: 0 0 15px rgba(255,255,255,0.4);
    }

    .control-box { 
      background: var(--bg-card); 
      padding: 30px; 
      border: 1px solid var(--border); 
      border-radius: 24px; 
      margin-bottom: 45px; 
      text-align: center; 
      max-width: 600px; 
      margin-left: auto; 
      margin-right: auto; 
      width: 100%; 
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1);
      animation: floatBox 6s ease-in-out infinite alternate;
    }
    @keyframes floatBox {
      0% { transform: translateY(0); }
      100% { transform: translateY(-5px); }
    }

    .control-box h3 { 
      font-size: 1.4rem; 
      margin-bottom: 20px; 
      font-weight: 400; 
      color: var(--text-sub); 
    }
    
    .control-box input[type="text"] { 
      width: 100%; 
      padding: 16px 20px; 
      border-radius: 100px; 
      border: 1px solid var(--border); 
      background: #000000; 
      color: #fff; 
      font-size: 1.2rem; 
      margin-bottom: 20px; 
      outline: none; 
      text-align: center; 
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .control-box input[type="text"]:focus { 
      border-color: #ffffff; 
      box-shadow: 0 0 20px rgba(255,255,255,0.3), inset 0 0 10px rgba(255,255,255,0.1); 
      transform: scale(1.02);
    }
    
    .camera-container { 
      display: none; 
      margin-bottom: 20px; 
      text-align: center; 
      background: #000; 
      border: 1px solid var(--border); 
      border-radius: 16px; 
      overflow: hidden; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
    }
    video { width: 100%; max-height: 400px; object-fit: cover; display: block; }
    
    .btn-group { display: flex; gap: 12px; justify-content: center; }
    .btn { 
      flex: 1; 
      padding: 14px; 
      border: 1px solid var(--border); 
      border-radius: 100px; 
      font-weight: 400; 
      font-size: 1.1rem; 
      cursor: pointer; 
      text-transform: uppercase; 
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
    }
    .btn-capture { background: var(--text-main); color: var(--bg-main); border-color: var(--text-main); }
    .btn-capture:hover { background: transparent; color: var(--text-main); border-color: #fff; box-shadow: 0 0 15px rgba(255,255,255,0.3); transform: translateY(-2px); }
    .btn-click-shot { background: var(--text-main); color: var(--bg-main); }
    .btn-close { background: transparent; color: var(--text-sub); }
    .btn:active { transform: scale(0.95); }

    .section-title { 
      font-size: 2rem; 
      text-align: center; 
      margin-bottom: 30px; 
      color: var(--text-sub); 
      font-weight: 400; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 15px; 
    }
    .section-title::before, .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
    .photo-card { 
      background: var(--bg-card); 
      border: 1px solid var(--border); 
      border-radius: 20px; 
      overflow: hidden; 
      display: flex; 
      flex-direction: column; 
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
      animation: fadeInUp 0.6s ease forwards;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .photo-card:hover { 
      transform: translateY(-8px) scale(1.01); 
      border-color: rgba(255,255,255,0.5); 
      box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 20px rgba(255,255,255,0.1); 
    }
    .photo-img { width: 100%; height: 280px; object-fit: cover; display: block; cursor: pointer; border-bottom: 1px solid var(--border); transition: transform 0.5s ease; }
    .photo-card:hover .photo-img { transform: scale(1.03); }
    
    .photo-info { padding: 22px; display: flex; flex-direction: column; gap: 14px; flex: 1; justify-content: space-between; }
    .photo-tagline { font-size: 1.3rem; font-weight: 400; color: var(--text-main); text-align: center; }
    .photo-footer { display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; color: var(--text-sub); border-top: 1px dashed var(--border); padding-top: 14px; }
    
    .btn-action-sm { 
      background: transparent; 
      border: 1px solid var(--border); 
      color: var(--text-main); 
      padding: 8px 16px; 
      font-size: 0.9rem; 
      cursor: pointer; 
      text-transform: uppercase; 
      border-radius: 100px; 
      text-decoration: none; 
      transition: all 0.3s ease; 
    }
    .btn-action-sm:hover { background: var(--text-main); color: var(--bg-main); border-color: var(--text-main); box-shadow: 0 0 10px rgba(255,255,255,0.4); transform: translateY(-2px); }
    .btn-del { border-color: #ff4444; color: #ff4444; }
    .btn-del:hover { background: #ff4444; color: #fff; box-shadow: 0 0 10px rgba(255,68,68,0.5); }

    footer.site-footer { 
      margin-top: 60px; 
      text-align: center; 
      border-top: 1px solid var(--border); 
      padding-top: 30px; 
      font-size: 1rem; 
      color: var(--text-sub); 
      display: flex; 
      flex-direction: column; 
      gap: 8px; 
    }
    footer.site-footer span { color: var(--text-main); text-shadow: 0 0 10px rgba(255,255,255,0.3); }

    .toast { 
      position: fixed; 
      bottom: 30px; 
      left: 50%; 
      transform: translateX(-50%) translateY(50px); 
      background: #ffffff; 
      color: #000000; 
      border: 1px solid #fff; 
      padding: 14px 28px; 
      font-size: 1.1rem; 
      opacity: 0; 
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); 
      pointer-events: none; 
      z-index: 1000; 
      border-radius: 100px; 
      box-shadow: 0 10px 30px rgba(255,255,255,0.3); 
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media(max-width: 480px) {
      .gallery-grid { grid-template-columns: 1fr; }
      body { padding: 16px; }
      .logo-area h1 { font-size: 2.6rem; }
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <header>
    <div class="logo-area">
      <h1>PHOTOGRAPHY WORK</h1>
    </div>
    <div id="mode-badge" class="badge">USER_VIEW</div>
  </header>

  <div id="admin-panel" class="control-box" style="display:none;">
    <h3>// NEW CAPTURE CONTROL</h3>
    <input type="text" id="photo-tagline-input" placeholder="ENTER AMAZING TAGLINE..." autocomplete="off">
    
    <div id="camera-box" class="camera-container">
      <video id="video" autoplay playsinline></video>
      <div style="padding: 14px; display: flex; gap: 12px; background: #000; border-top: 1px solid var(--border);">
        <button class="btn btn-click-shot" onclick="takeSnapshot()">SNAP & STORE</button>
        <button class="btn btn-close" onclick="stopCamera()">CLOSE</button>
      </div>
    </div>

    <div class="btn-group" id="start-cam-btn-wrap">
      <button class="btn btn-capture" onclick="startCamera()">OPEN CAMERA</button>
    </div>
  </div>

  <div class="section-title">ARCHIVED GALLERY</div>
  <canvas id="canvas" style="display:none;"></canvas>
  <div class="gallery-grid" id="gallery-container"></div>

  <footer class="site-footer">
    <div>&copy; 2026 PHOTOGRAPHY WORK. ALL RIGHTS RESERVED.</div>
    <div>CURATED WITH PASSION BY <span>CHINMAY</span></div>
  </footer>

  <div id="toast" class="toast"></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const isAdmin = urlParams.get('admin') === 'true';

    if (isAdmin) {
      document.getElementById('admin-panel').style.display = 'block';
      const badge = document.getElementById('mode-badge');
      badge.innerText = 'ADMIN_MODE';
      badge.classList.add('admin');
    }

    let db;
    let videoStream = null;

    const request = indexedDB.open('ChinmayNDotLensDB', 5);

    request.onerror = function(event) {
      console.error('DB Error: ' + event.target.errorCode);
    };

    request.onsuccess = function(event) {
      db = event.target.result;
      renderGallery();
    };

    request.onupgradeneeded = function(event) {
      const dbInstance = event.target.result;
      if (!dbInstance.objectStoreNames.contains('photos')) {
        dbInstance.createObjectStore('photos', { keyPath: 'id', autoIncrement: true });
      }
    };

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    async function startCamera() {
      const tagline = document.getElementById('photo-tagline-input').value.trim();
      if (!tagline) {
        showToast('PEHLE TAGLINE DAAL MERE BHAI!');
        document.getElementById('photo-tagline-input').focus();
        return;
      }

      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'environment' }, 
          audio: false 
        });
        const video = document.getElementById('video');
        video.srcObject = videoStream;
        document.getElementById('camera-box').style.display = 'block';
        document.getElementById('start-cam-btn-wrap').style.display = 'none';
      } catch (err) {
        alert('CAMERA ACCESS ERROR: ' + err.message);
      }
    }

    function stopCamera() {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
      }
      document.getElementById('camera-box').style.display = 'none';
      document.getElementById('start-cam-btn-wrap').style.display = 'flex';
    }

    function takeSnapshot() {
      const tagline = document.getElementById('photo-tagline-input').value.trim();
      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.85);

      const photoData = {
        url: compressedDataUrl,
        tagline: tagline,
        date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
      };

      const transaction = db.transaction(['photos'], 'readwrite');
      const store = transaction.objectStore('photos');
      const req = store.add(photoData);

      req.onsuccess = function() {
        document.getElementById('photo-tagline-input').value = '';
        stopCamera();
        renderGallery();
        showToast('PHOTO CAPTURED & SAVED SECURELY!');
      };

      req.onerror = function() {
        showToast('ERROR SAVING PHOTO.');
      };
    }

    function deletePhoto(id) {
      if (!isAdmin) return;
      if (confirm('KYA AAP IS PHOTO KO DELETE KARNA CHAHTE HAIN?')) {
        const transaction = db.transaction(['photos'], 'readwrite');
        const store = transaction.objectStore('photos');
        const req = store.delete(Number(id));

        req.onsuccess = function() {
          renderGallery();
          showToast('PHOTO DELETED SUCCESSFULLY.');
        };
      }
    }

    function renderGallery() {
      if (!db) return;
      const container = document.getElementById('gallery-container');
      container.innerHTML = '';

      const transaction = db.transaction(['photos'], 'readonly');
      const store = transaction.objectStore('photos');
      const requestAll = store.getAll();

      requestAll.onsuccess = function(event) {
        const photosDB = event.target.result.reverse();

        if (photosDB.length === 0) {
          container.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:var(--text-sub); padding:40px; font-size:1.2rem;">// NO SHOTS ARCHIVED YET. USE ADMIN LINK TO UPLOAD!</div>`;
          return;
        }

        photosDB.forEach((item, index) => {
          const card = document.createElement('div');
          card.className = 'photo-card';
          card.style.animationDelay = `${index * 0.1}s`;
          card.innerHTML = `
            <img src="${item.url}" class="photo-img" onclick="window.open('${item.url}', '_blank')">
            <div class="photo-info">
              <div class="photo-tagline">"${escapeHtml(item.tagline)}"</div>
              <div class="photo-footer">
                <span>${item.date}</span>
                <div style="display:flex; gap:8px;">
                  <a href="${item.url}" download="Chinmay_Lens_${item.id}.jpg" class="btn-action-sm">SAVE</a>
                  ${isAdmin ? `<button class="btn-action-sm btn-del" onclick="deletePhoto(${item.id})">DELETE</button>` : ''}
                </div>
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      };
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, match => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[match]));
    }
  </script>
</body>
</html>
